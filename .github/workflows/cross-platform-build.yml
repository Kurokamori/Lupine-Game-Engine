name: Cross-Platform Build Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: x64-windows-static
            artifact_name: windows-x64
            exe_extension: .exe
            python_ext: .pyd

          - os: ubuntu-latest
            triplet: x64-linux
            artifact_name: linux-x64
            exe_extension: ""
            python_ext: .so

          - os: macos-latest
            triplet: x64-osx
            artifact_name: macos-x64
            exe_extension: ""
            python_ext: .so

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: false

    - name: Install Rake
      run: gem install rake

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ninja-build \
          pkg-config \
          libx11-dev \
          libxrandr-dev \
          libxi-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libxinerama-dev \
          libxcursor-dev \
          libvulkan-dev \
          vulkan-headers \
          python3-dev \
          autoconf \
          autoconf-archive \
          automake \
          libtool \
          libltdl-dev

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        brew install ninja pkg-config vulkan-headers vulkan-loader molten-vk libiconv

    - name: Install macOS build dependencies
      if: runner.os == 'macOS'
      run: |
        brew install autoconf autoconf-archive automake libtool libiconv

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'vcpkg.json'

    - name: Setup CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      shell: bash
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
          ${{ matrix.os == 'windows-latest' && '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL' || '' }} \
          -G Ninja

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Test Console Application
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          ./build/bin/Release/lupine_console${{ matrix.exe_extension }}
        else
          ./build/bin/lupine_console${{ matrix.exe_extension }}
        fi
      continue-on-error: false

    - name: Verify Python Modules Built
      shell: bash
      run: |
        echo "Checking for Python modules..."
        ls -la editor/ || echo "Editor directory not found"

        if [ -f "editor/lupine_engine${{ matrix.python_ext }}" ]; then
          echo "✓ lupine_engine module found"
        else
          echo "✗ lupine_engine module NOT found"
          exit 1
        fi

        if [ -f "editor/lupine_runtime${{ matrix.python_ext }}" ]; then
          echo "✓ lupine_runtime module found"
        else
          echo "✗ lupine_runtime module NOT found"
          exit 1
        fi

    - name: Test Python Module Loading
      shell: bash
      run: |
        python main.py || echo "Editor test completed with warnings (expected if no display)"

    - name: Package Build Artifacts
      shell: bash
      run: |
        mkdir -p artifacts/${{ matrix.artifact_name }}/bin
        mkdir -p artifacts/${{ matrix.artifact_name }}/python_modules
        mkdir -p artifacts/${{ matrix.artifact_name }}/mruby

        # Copy executables
        if [ "$RUNNER_OS" == "Windows" ]; then
          cp build/bin/Release/* artifacts/${{ matrix.artifact_name }}/bin/ || true
        else
          cp build/bin/* artifacts/${{ matrix.artifact_name }}/bin/ || true
        fi

        # Copy Python modules
        cp editor/lupine_engine${{ matrix.python_ext }} artifacts/${{ matrix.artifact_name }}/python_modules/ || true
        cp editor/lupine_runtime${{ matrix.python_ext }} artifacts/${{ matrix.artifact_name }}/python_modules/ || true

        # Copy mRuby library for cross-platform deployment
        cp -r external/mruby/build/host/lib/* artifacts/${{ matrix.artifact_name }}/mruby/ || true
        cp -r external/mruby/include artifacts/${{ matrix.artifact_name }}/mruby/ || true

        # Copy editor files
        cp main.py artifacts/${{ matrix.artifact_name }}/ || true
        cp requirements.txt artifacts/${{ matrix.artifact_name }}/ || true

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lupine-engine-${{ matrix.artifact_name }}
        path: artifacts/${{ matrix.artifact_name }}/
        retention-days: 30

    - name: Display Build Summary
      shell: bash
      run: |
        echo "=========================================="
        echo "Build Summary for ${{ matrix.os }}"
        echo "=========================================="
        echo "Platform: ${{ matrix.artifact_name }}"
        echo "Build Type: ${{ env.BUILD_TYPE }}"
        echo "Triplet: ${{ matrix.triplet }}"
        echo ""
        echo "Built Executables:"
        if [ "$RUNNER_OS" == "Windows" ]; then
          ls -lh build/bin/Release/*.exe || echo "No executables found"
        else
          file build/bin/* || echo "No executables found"
        fi
        echo ""
        echo "Python Modules:"
        ls -lh editor/*${{ matrix.python_ext }} || echo "No Python modules found"
        echo "=========================================="

  # Job to check if all builds succeeded
  build-status:
    name: Build Status Check
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()

    steps:
    - name: Check build results
      run: |
        if [ "${{ needs.build-and-test.result }}" == "success" ]; then
          echo "✓ All platform builds succeeded!"
          exit 0
        else
          echo "✗ Some platform builds failed!"
          exit 1
        fi

    - name: Summary
      if: success()
      run: |
        echo "=========================================="
        echo "Cross-Platform Build: SUCCESS"
        echo "=========================================="
        echo "All platforms built successfully:"
        echo "  ✓ Windows (x64)"
        echo "  ✓ Linux (x64)"
        echo "  ✓ macOS (x64)"
        echo "=========================================="
